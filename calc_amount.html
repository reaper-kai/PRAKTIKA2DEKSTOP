<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кредитный Калькулятор - Сумма</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="progress-bar-container">
            <div class="progress-fill" style="width: 33.3%;"></div>
        </div>
        
        <div class="step-content">
            <div class="step-header">
                <a href="index.html" class="back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
            </div>

            <h1>Какая сумма вам необходима?</h1>
            
            <div class="stepper">
                <button class="stepper-btn" id="minus-btn">−</button>
                <div class="stepper-value">
                    <span class="amount" id="amount-display">1 000 000</span>
                    <span class="unit">Рублей</span>
                </div>
                <button class="stepper-btn" id="plus-btn">+</button>
            </div>

            <div class="chips-grid" id="chips-container">
                <div class="chip" data-value="500000">500 000 ₽</div>
                <div class="chip active" data-value="1000000">1 000 000 ₽</div>
                <div class="chip" data-value="2500000">2 500 000 ₽</div>
                <div class="chip" data-value="5000000">5 000 000 ₽</div>
            </div>

            <a href="calc_term.html" class="btn-primary btn-wide">Продолжить</a>
        </div>

        <script>
            const display = document.getElementById('amount-display');
            const chips = document.querySelectorAll('.chip');
            let currentAmount = 1000000;

            function updateDisplay() {
                display.innerText = currentAmount.toLocaleString('ru-RU');
                chips.forEach(chip => {
                    if (parseInt(chip.getAttribute('data-value')) === currentAmount) {
                        chip.classList.add('active');
                    } else {
                        chip.classList.remove('active');
                    }
                });
            }

            document.getElementById('plus-btn').addEventListener('click', () => {
                currentAmount += 100000;
                updateDisplay();
            });

            document.getElementById('minus-btn').addEventListener('click', () => {
                if (currentAmount > 100000) {
                    currentAmount -= 100000;
                    updateDisplay();
                }
            });

            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    currentAmount = parseInt(chip.getAttribute('data-value'));
                    updateDisplay();
                });
            });
        </script>

        <nav class="footer-nav">
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Главная
            </a>
            <a href="#" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v2H7zm0 4h2v2H7zm4-4h2v2h-2zm0 4h2v2h-2zm4-4h2v2h-2zm0 4h2v2h-2z"/></svg>
                Расчет
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l4.59-4.58L18 11l-6 6z"/></svg>
                Результат
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.09-4-4L2 15.08l1.5 1.41z"/></svg>
                График
            </a>
        </nav>
    </div>
</body>
</html>
